<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2e3d"/>
      <stop offset="50%" style="stop-color:#0d5a8b"/>
      <stop offset="100%" style="stop-color:#00a8cc"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0d8ab5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Dot grid pattern -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="12.5" cy="12.5" r="1" fill="white"/>
    </pattern>
    <rect width="800" height="500" fill="url(#dots)"/>
  </g>

  <!-- Browser mockup -->
  <rect x="120" y="60" width="560" height="380" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Browser top bar -->
  <rect x="120" y="60" width="560" height="36" rx="12" fill="rgba(0,0,0,0.3)"/>
  <rect x="120" y="84" width="560" height="12" fill="rgba(0,0,0,0.3)"/>
  <circle cx="142" cy="78" r="5" fill="#ff5f57"/>
  <circle cx="160" cy="78" r="5" fill="#febc2e"/>
  <circle cx="178" cy="78" r="5" fill="#28c840"/>
  <rect x="240" y="72" width="200" height="12" rx="6" fill="rgba(255,255,255,0.1)"/>

  <!-- Navbar mockup -->
  <rect x="140" y="108" width="520" height="32" fill="rgba(255,255,255,0.06)"/>
  <rect x="155" y="116" width="60" height="14" rx="3" fill="rgba(0,212,255,0.4)"/>
  <rect x="480" y="118" width="40" height="10" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="530" y="118" width="40" height="10" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="580" y="118" width="60" height="10" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Hero section mockup -->
  <rect x="155" y="156" width="220" height="14" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="155" y="180" width="180" height="10" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="155" y="198" width="200" height="10" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="155" y="216" width="160" height="10" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- CTA button mockup -->
  <rect x="155" y="242" width="100" height="28" rx="6" fill="url(#btn)"/>
  <rect x="162" y="251" width="86" height="10" rx="2" fill="rgba(255,255,255,0.7)"/>

  <!-- Tooth icon -->
  <g transform="translate(480, 170)" opacity="0.9">
    <path d="M0,-40 C-8,-40 -22,-36 -28,-20 C-34,-4 -30,14 -24,30 C-20,40 -16,48 -12,48 C-8,48 -6,36 -4,28 C-2,20 0,16 0,16 C0,16 2,20 4,28 C6,36 8,48 12,48 C16,48 20,40 24,30 C30,14 34,-4 28,-20 C22,-36 8,-40 0,-40Z" fill="white" opacity="0.8"/>
  </g>

  <!-- Calendar cards mockup -->
  <rect x="420" y="260" width="70" height="60" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <rect x="500" y="260" width="70" height="60" rx="6" fill="rgba(0,212,255,0.15)" stroke="rgba(0,212,255,0.4)" stroke-width="1"/>
  <rect x="580" y="260" width="70" height="60" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <text x="455" y="283" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle">Mon</text>
  <text x="535" y="283" font-family="sans-serif" font-size="8" fill="#00d4ff" text-anchor="middle">Tue</text>
  <text x="615" y="283" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle">Wed</text>

  <!-- Service cards mockup -->
  <rect x="155" y="290" width="110" height="70" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="275" y="290" width="110" height="70" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="155" y="370" width="110" height="56" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="275" y="370" width="110" height="56" rx="6" fill="rgba(255,255,255,0.06)"/>

  <!-- Title overlay -->
  <text x="400" y="478" font-family="'Courier New', monospace" font-size="13" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="4">D-CUBE DENTAL — NEXT.JS + MONGODB</text>
</svg>
