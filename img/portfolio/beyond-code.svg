<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="bgw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#120a2e"/>
      <stop offset="100%" style="stop-color:#1a0a3e"/>
    </linearGradient>
    <linearGradient id="quill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="40%" style="stop-color:#00d4ff"/>
      <stop offset="70%" style="stop-color:#FFE800"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#bgw)"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <pattern id="dotsw" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="white"/>
    </pattern>
    <rect width="600" height="500" fill="url(#dotsw)"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="300" cy="200" r="120" fill="rgba(0,212,255,0.03)"/>
  <circle cx="300" cy="200" r="80" fill="rgba(123,47,247,0.04)"/>

  <!-- Open book -->
  <g transform="translate(300, 280)">
    <!-- Left page -->
    <path d="M-10,0 L-10,-120 Q-10,-130 -20,-130 L-130,-130 Q-140,-130 -140,-120 L-140,0 Q-140,8 -130,10 L-20,10 Q-10,8 -10,0Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Right page -->
    <path d="M10,0 L10,-120 Q10,-130 20,-130 L130,-130 Q140,-130 140,-120 L140,0 Q140,8 130,10 L20,10 Q10,8 10,0Z" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Spine -->
    <line x1="0" y1="-130" x2="0" y2="10" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>

    <!-- Text lines on left page -->
    <rect x="-120" y="-110" width="80" height="4" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="-120" y="-98" width="95" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="-120" y="-88" width="70" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="-120" y="-78" width="90" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="-120" y="-68" width="60" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="-120" y="-52" width="85" height="4" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="-120" y="-40" width="95" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="-120" y="-30" width="75" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="-120" y="-20" width="90" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>

    <!-- Text lines on right page -->
    <rect x="25" y="-110" width="90" height="4" rx="2" fill="rgba(0,212,255,0.15)"/>
    <rect x="25" y="-98" width="100" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="25" y="-88" width="75" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="25" y="-78" width="95" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="25" y="-68" width="65" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="25" y="-52" width="80" height="4" rx="2" fill="rgba(123,47,247,0.15)"/>
    <rect x="25" y="-40" width="100" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="25" y="-30" width="85" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
    <rect x="25" y="-20" width="90" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
  </g>

  <!-- Phoenix feather / quill -->
  <g transform="translate(300, 100)" opacity="0.9">
    <path d="M0,60 Q-3,40 -2,20 Q-1,0 3,-25 Q5,-40 4,-55 Q3,-65 6,-70 Q10,-60 8,-45 Q6,-30 5,-10 Q4,5 5,20 Q6,35 3,60Z" fill="url(#quill)" opacity="0.7"/>
    <path d="M3,-25 Q8,-35 15,-40 Q10,-30 6,-22" fill="rgba(0,212,255,0.4)"/>
    <path d="M3,-10 Q10,-18 18,-20 Q12,-12 6,-8" fill="rgba(0,212,255,0.3)"/>
    <path d="M4,5 Q12,-2 20,-2 Q13,5 7,8" fill="rgba(123,47,247,0.3)"/>
    <!-- Nib -->
    <path d="M0,60 L-2,75 L0,80 L2,75 L0,60" fill="rgba(255,232,0,0.6)"/>
    <!-- Ink drops -->
    <circle cx="0" cy="88" r="3" fill="rgba(0,212,255,0.3)"/>
    <circle cx="-6" cy="95" r="2" fill="rgba(123,47,247,0.25)"/>
    <circle cx="5" cy="93" r="1.5" fill="rgba(255,232,0,0.25)"/>
  </g>

  <!-- Floating quote marks -->
  <text x="130" y="130" font-family="Georgia, serif" font-size="60" fill="rgba(0,212,255,0.08)">"</text>
  <text x="440" y="380" font-family="Georgia, serif" font-size="60" fill="rgba(123,47,247,0.08)">"</text>

  <!-- Title -->
  <text x="300" y="370" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="6">PHOENIX FLAMES</text>
  <text x="300" y="395" font-family="sans-serif" font-size="9" fill="rgba(0,212,255,0.3)" text-anchor="middle" letter-spacing="2">Resilience · Growth · Transformation</text>

  <!-- Floating particles -->
  <circle cx="100" cy="100" r="2" fill="rgba(0,212,255,0.2)"/>
  <circle cx="500" cy="80" r="1.5" fill="rgba(123,47,247,0.2)"/>
  <circle cx="480" cy="420" r="2" fill="rgba(255,232,0,0.15)"/>
  <circle cx="120" cy="380" r="1.5" fill="rgba(0,212,255,0.15)"/>
  <circle cx="200" cy="50" r="1" fill="rgba(255,255,255,0.1)"/>
  <circle cx="420" cy="140" r="1" fill="rgba(255,255,255,0.1)"/>
</svg>
